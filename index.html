<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Police Manager - Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

font-family:Arial, sans-serif;
background:#071B2E;
color:white;
text-align:center;
margin:0;
padding:20px;
}

h1{
margin-top:20px;
}

#reader{
width:320px;
margin:auto;
margin-top:20px;
background:white;
border-radius:15px;
padding:10px;
}

#resultat{
margin-top:25px;
font-size:22px;
font-weight:bold;
}

.valide{

}

.refus{

}

button{

padding:15px 30px;
font-size:20px;
border:none;
border-radius:10px;
background:#1E88E5;
color:white;
}
</style>

</head>

<body>

<div id="reader"></div>

<div id="resultat">

function onScanSuccess(code){

document.getElementById("bip").play();

let r=document.getElementById("resultat");

if(cartes[code]){

let c=cartes[code];

if(c.type=="policier"){

r.innerHTML="🔵<br><br>ACCÈS AUTORISÉ<br><br>"+c.nom+"<br>"+c.grade;
r.className="valide";

}else if(c.type=="personnel"){

r.innerHTML="🟣<br><br>PERSONNEL AUTORISÉ<br><br>"+c.nom+"<br>"+c.grade;
r.className="valide";

}else if(c.type=="invite"){

r.innerHTML="🟡<br><br>ACCÈS INVITÉ<br><br>"+c.nom+"<br>"+c.grade;
r.className="valide";

}else{

r.innerHTML="🟠<br><br>DÉTENU IDENTIFIÉ<br><br>"+c.nom;
r.className="valide";

}

}else{

r.innerHTML="🔴<br><br>CARTE INCONNUE<br><br>ACCÈS REFUSÉ";
r.className="refus";

}

}

new Html5QrcodeScanner(
"reader",
{fps:10, qrbox:250}
).render(onScanSuccess);

</script>
