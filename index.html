<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Police Manager - Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
font-family:Arial, sans-serif;
background:#071B2E;
color:white;
text-align:center;
margin:0;
padding:20px;
}

h1{
margin-top:20px;
}

#reader{
width:320px;
margin:auto;
margin-top:20px;
background:white;
border-radius:15px;
padding:10px;
}

#resultat{
margin-top:25px;
font-size:22px;
font-weight:bold;
}

.valide{
color:#4CFF4C;
}

.refus{
color:#FF4C4C;
}

button{
margin-top:20px;
padding:15px 30px;
font-size:20px;
border:none;
border-radius:10px;
background:#1E88E5;
color:white;
}
</style>

</head>

<body>

<h1>🚔 Police Manager</h1>

<div id="reader"></div>

<div id="resultat">
En attente d'un QR Code...
</div>

<audio id="bip">
<source src="https://actions.google.com/sounds/v1/cartoon/pop.ogg">
</audio>

<script>

const cartes = {

"POL-001":{
nom:"Raphaël MORENO",
grade:"Directeur et Commandant",
type:"policier"
},

"POL-002":{
nom:"Hugo FLOTARD",
grade:"Capitaine",
type:"policier"
},

"POL-003":{
nom:"Margaud DUCHÊNE",
grade:"Gardienne",
type:"policier"
},

"POL-004":{
nom:"Louis FRIGAUD",
grade:"Gardien",
type:"policier"
},

"DET-001":{
nom:"Martin Dupont",
type:"détenu"
},

"DET-002":{
nom:"Lucas Dumart",
type:"détenu"
},

"DET-003":{
nom:"Chloé Vignalant",
type:"détenu"
},

"INV-001":{
nom:"Bienvenue",
type:"invitée"
}

};

function onScanSuccess(code){

document.getElementById("bip").play();

let r=document.getElementById("resultat");

if(cartes[code]){

let c=cartes[code];

if(c.type=="policier"){

r.innerHTML="🟢<br><br>ACCÈS AUTORISÉ<br><br>"+c.nom+"<br>"+c.grade;
r.className="valide";

}else{

r.innerHTML="🟢<br><br>DÉTENU RECONNU<br><br>"+c.nom;
r.className="valide";

}

}else{

r.innerHTML="🔴<br><br>CARTE INCONNUE<br><br>ACCÈS REFUSÉ";
r.className="refus";

}

}

new Html5QrcodeScanner(
"reader",
{fps:10, qrbox:250}
).render(onScanSuccess);

</script>

</body>
</html>
