<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Police Manager - Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
box-sizing:border-box;
}

body{
font-family:"Segoe UI", Arial, sans-serif;
background:#061525;
color:white;
margin:0;
padding:20px;
}


/* En-tête */

header{
background:linear-gradient(135deg,#0b2a4a,#061525);
padding:25px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
margin-bottom:20px;
}

h1{
margin:0;
font-size:32px;
}

.subtitle{
color:#9bb7d4;
margin-top:8px;
}


/* Cartes */

.card{

background:#0d2238;
border-radius:18px;
padding:20px;
margin-top:20px;
box-shadow:0 8px 20px rgba(0,0,0,0.35);

}


/* Scanner */

#reader{

width:100%;
max-width:400px;
margin:auto;
background:white;
border-radius:15px;
padding:10px;

}


/* Boutons */

button{

border:none;
border-radius:12px;
padding:15px 25px;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin:8px;
color:white;
background:#1464b8;

transition:0.2s;

}


button:hover{

transform:scale(1.05);

}


button:active{

transform:scale(0.95);

}


/* Entrée sortie */

.btn-entree{

background:#0aa84f;

}


.btn-sortie{

background:#c62828;

}


/* Lieu */

select{

width:90%;
padding:15px;
border-radius:12px;
background:#071b2e;
color:white;
border:1px solid #355b7d;
font-size:16px;

}


/* Résultat scan */

#resultat{

margin-top:20px;
font-size:22px;
font-weight:bold;
padding:20px;
border-radius:15px;

}


.valide{

background:#123d29;
color:#5cff8d;

}


.refus{

background:#451b1b;
color:#ff6b6b;

}


/* Historique */

#historique{

background:#081827;
padding:20px;
border-radius:15px;
max-height:300px;
overflow-y:auto;
text-align:left;

}


/* Titres */

h2,h3{

color:#5fa8ff;

}


/* Badge système */

.status{

display:inline-block;
background:#083d24;
color:#4cff8b;
padding:8px 15px;
border-radius:20px;
font-weight:bold;

}

</style>

</head>

<body>
<div id="connexion">

<h1>🚔 POLICE MANAGER PRO</h1>

<h2>Connexion agent</h2>

<input id="identifiant" placeholder="Identifiant (POL-001)">

<br><br>

<input id="code" type="password" placeholder="Code personnel">

<br><br>

<button onclick="connexion()">
🔐 Connexion
</button>

<p id="erreur"></p>

</div>

<div id="application" style="display:none;">
<header>

<h1>🚔 POLICE MANAGER PRO</h1>

<div class="subtitle">
Système de contrôle d'accès du commissariat
</div>

<br>

<span class="status">
🟢 Système opérationnel
</span>

<button onclick="deconnexion()">
🚪 Déconnexion
</button>

</header>

<div style="margin-top:20px;">

<button onclick="action='Entrée'">
➡️ Entrée
</button>

<button onclick="action='Sortie'">
⬅️ Sortie
</button>

</div>

<div class="card">

<h2>📷 Scanner QR</h2>

<div id="reader"></div>

</div>
<h3>📍 Choisissez un lieu</h3>

<select id="lieu">
<option>Entrée principale</option>
<option>Accueil</option>
<option>Poste de garde</option>
<option>Bureau du directeur</option>
<option>Bureau des policiers</option>
<option>Salle d'audition</option>
<option>Salle d'interrogatoire</option>
<option>Armurerie</option>
<option>Local des preuves</option>
<option>Infirmerie</option>
<option>Vestiaires</option>
<option>Réfectoire</option>
<option>Cour de promenade</option>
<option>Cellule A1</option>
<option>Cellule A2</option>
<option>Cellule B1</option>
<option>Cellule B2</option>
<option>Parloir</option>
<option>Garage</option>
<option>Sortie principale</option>
</select>

<br><br>

<div id="resultat">
En attente d'un QR Code...
</div>
<h2>📜 Historique</h2>

<div id="historique"
style="
background:#102B45;
padding:15px;
border-radius:10px;
margin-top:20px;
text-align:left;
max-height:250px;
overflow-y:auto;
">

Aucun scan enregistré.

</div>

<br>

<button onclick="viderHistorique()">
🗑️ Effacer l'historique
</button>

<audio id="bip">
<source src="https://actions.google.com/sounds/v1/cartoon/pop.ogg">
</audio>

<script>

let action = "Entrée";
let lieu = "";
let scanEnCours = false;

const cartes = {

"POL-001":{
nom:"Raphaël MORENO",
code:"4829",
grade:"Directeur",
type:"policier",
admin:true
},

"POL-002":{
nom:"Hugo FLOTARD",
code:"7391",
grade:"Capitaine",
type:"policier",
admin:false
},

"POL-003":{
nom:"Margaud DUCHÊNE",
code:"6154",
grade:"Gardienne",
type:"policier",
admin:false
},

"POL-004":{
nom:"Louis FRIGAUD",
code:"9283",
grade:"Gardien",
type:"policier",
admin:false
},

"POL-005":{
nom:"Émilie LAMBERT",
code:"4176",
grade:"Lieutenante",
type:"policier",
admin:false
},

"POL-006":{
nom:"Maxime ROUX",
code:"9362",
grade:"Brigadier-chef",
type:"policier",
admin:false
},

"POL-007":{
nom:"Laura MOREAU",
code:"5284",
grade:"Gardienne de la paix",
type:"policier",
admin:false
},

"POL-008":{
nom:"Julien GARNIER",
code:"7641",
grade:"Major",
type:"policier",
admin:false
},

"POL-009":{
nom:"Sarah DUBOIS",
code:"8503",
grade:"Capitaine",
type:"policier",
admin:false
},

"POL-010":{
nom:"Alexandre MERCIER",
code:"2917",
grade:"Commandant",
type:"policier",
admin:false
},

"PER-001":{
nom:"Marie TUTTARD",
grade:"Agent d'entretien",
type:"personnel"
},

"PER-002":{
nom:"Sophie MARTIN",
grade:"Secrétaire",
type:"personnel"
},

"PER-003":{
nom:"Thomas DURAND",
code:"6648",
grade:"Technicien informatique",
type:"personnel",
admin:true
},

"PER-004":{
nom:"Julie BERNARD",
grade:"Agent d'accueil",
type:"personnel"
},

"PER-005":{
nom:"Claire ROBERT",
grade:"Psychologue",
type:"personnel"
},

"PER-006":{
nom:"Antoine GIRAUD",
grade:"Médecin",
type:"personnel"
},

"INV-001":{
nom:"Invité",
grade:"Visiteur",
type:"invite"
},

"DET-001":{
nom:"Martin Dupont",
type:"détenu"
},

"DET-002":{
nom:"Lucas Dumart",
type:"détenu"
},

"DET-003":{
nom:"Chloé Vignalant",
type:"détenu"
},

"DET-004":{
nom:"Kévin MOREL",
type:"détenu"
},

"DET-005":{
nom:"Nicolas GARCIA",
type:"détenu"
},

"DET-006":{
nom:"Anthony RENAUD",
type:"détenu"
},

"DET-007":{
nom:"Jordan PETIT",
type:"détenu"
},

"DET-008":{
nom:"Lucas RICHARD",
type:"détenu"
},

"DET-009":{
nom:"Mathis CHEVALIER",
type:"détenu"
},

"DET-010":{
nom:"Nathan BLANC",
type:"détenu"
}

};

let utilisateurConnecte = null;

function onScanSuccess(code){

if(scanEnCours){
return;
}

scanEnCours = true;

lieu = document.getElementById("lieu").value;

document.getElementById("bip").play();

let r=document.getElementById("resultat");

let maintenant=new Date();

let date=maintenant.toLocaleDateString("fr-FR");

let heure=maintenant.toLocaleTimeString("fr-FR");

if(cartes[code]){

let c=cartes[code];

if(c.type=="policier"){

r.innerHTML=
"🔵<br><br>"+
action.toUpperCase()+
"<br><br>"+
(action=="Entrée" ? "ACCÈS AUTORISÉ" : "SORTIE ENREGISTRÉE")+
"<br><br>"+
c.nom+
"<br>"+
c.grade+
"<br><br>📍 "+lieu;

r.className="valide";

ajouterHistorique(
date+" - "+heure+
"<br>"+
action+
" | "+
c.nom+
"<br>📍 "+lieu
);
  
}else if(c.type=="personnel"){

r.innerHTML=
"🟣<br><br>"+
action.toUpperCase()+
"<br><br>"+
"PERSONNEL AUTORISÉ"+
"<br><br>"+
c.nom+
"<br>"+
c.grade+
"<br><br>📍 "+lieu;

r.className="valide";

ajouterHistorique(
date+" - "+heure+
"<br>"+
action+
" | "+
c.nom+
"<br>📍 "+lieu
);

}else if(c.type=="invite"){

r.innerHTML=
"🟡<br><br>"+
action.toUpperCase()+
"<br><br>"+
(action=="Entrée" ? "ACCÈS INVITÉ" : "DÉPART DE L'INVITÉ")+
"<br><br>"+
c.nom+
"<br>"+
c.grade+
"<br><br>📍 "+lieu;

r.className="valide";

ajouterHistorique(
date+" - "+heure+
"<br>"+
action+
" | "+
c.nom+
"<br>📍 "+lieu
);

}else{

r.innerHTML=
"🟠<br><br>"+
action.toUpperCase()+
"<br><br>"+
"DÉTENU IDENTIFIÉ"+
"<br><br>"+
c.nom+
"<br><br>📍 "+lieu;

r.className="valide";

ajouterHistorique(
date+" - "+heure+
"<br>"+
action+
" | "+
c.nom+
"<br>📍 "+lieu
);

}

}else{

r.innerHTML="🔴<br><br>CARTE INCONNUE<br><br>ACCÈS REFUSÉ";
r.className="refus";

}

setTimeout(()=>{
scanEnCours = false;
},3000);  

}

function ajouterHistorique(texte){

let historique = JSON.parse(localStorage.getItem("historique")) || [];

historique.unshift(texte);

localStorage.setItem(
"historique",
JSON.stringify(historique)
);

afficherHistorique();

}

function afficherHistorique(){

let h=document.getElementById("historique");

let historique =
JSON.parse(localStorage.getItem("historique")) || [];

if(historique.length==0){

h.innerHTML="Aucun scan enregistré.";

return;

}

h.innerHTML = historique.join("<hr>");

}

function viderHistorique(){

localStorage.removeItem("historique");

document.getElementById("historique").innerHTML =
"Aucun scan enregistré.";

}

afficherHistorique();

new Html5QrcodeScanner(
"reader",
{fps:10, qrbox:250}
).render(onScanSuccess);

function connexion(){

let id = document.getElementById("identifiant").value;
let code = document.getElementById("code").value;

if(cartes[id] && cartes[id].code == code){

utilisateurConnecte = cartes[id];

document.getElementById("connexion").style.display="none";
document.getElementById("application").style.display="block";

}else{

document.getElementById("erreur").innerHTML =
"🔴 Identifiant ou code incorrect";

}

} // ← cette accolade ferme connexion()

function deconnexion(){

utilisateurConnecte = null;

document.getElementById("application").style.display="none";
document.getElementById("connexion").style.display="block";

}
  
</script>

</div>
</body>
</html>
