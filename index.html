<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Police Manager - Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
font-family:Arial, sans-serif;
background:#071B2E;
color:white;
text-align:center;
margin:0;
padding:20px;
}

h1{
margin-top:20px;
}

#reader{
width:320px;
margin:auto;
margin-top:20px;
background:white;
border-radius:15px;
padding:10px;
}

#resultat{
margin-top:25px;
font-size:22px;
font-weight:bold;
}

.valide{
color:#4CFF4C;
}

.refus{
color:#FF4C4C;
}

button{
margin-top:20px;
padding:15px 30px;
font-size:20px;
border:none;
border-radius:10px;
background:#1E88E5;
color:white;
}
</style>

</head>

<body>

<h1>🚔 Police Manager</h1>

<div style="margin-top:20px;">

<button onclick="action='Entrée'">
➡️ Entrée
</button>

<button onclick="action='Sortie'">
⬅️ Sortie
</button>

</div>

<div id="reader"></div>
<h3>📍 Choisissez un lieu</h3>

<select id="lieu">
<option>Entrée principale</option>
<option>Accueil</option>
<option>Poste de garde</option>
<option>Bureau du directeur</option>
<option>Bureau des policiers</option>
<option>Salle d'audition</option>
<option>Salle d'interrogatoire</option>
<option>Armurerie</option>
<option>Local des preuves</option>
<option>Infirmerie</option>
<option>Vestiaires</option>
<option>Réfectoire</option>
<option>Cour de promenade</option>
<option>Cellule A1</option>
<option>Cellule A2</option>
<option>Cellule B1</option>
<option>Cellule B2</option>
<option>Parloir</option>
<option>Garage</option>
<option>Sortie principale</option>
</select>

<br><br>

<div id="resultat">
En attente d'un QR Code...
</div>
<h2>📜 Historique</h2>

<div id="historique"
style="
background:#102B45;
padding:15px;
border-radius:10px;
margin-top:20px;
text-align:left;
max-height:250px;
overflow-y:auto;
">

Aucun scan enregistré.

</div>

<br>

<button onclick="viderHistorique()">
🗑️ Effacer l'historique
</button>

<audio id="bip">
<source src="https://actions.google.com/sounds/v1/cartoon/pop.ogg">
</audio>

<script>

let action = "Entrée";
let lieu = "";

const cartes = {

"POL-001":{
nom:"Raphaël MORENO",
grade:"Directeur",
type:"policier"
},

"POL-002":{
nom:"Hugo FLOTARD",
grade:"Capitaine",
type:"policier"
},

"POL-003":{
nom:"Margaud DUCHÊNE",
grade:"Gardienne",
type:"policier"
},

"POL-004":{
nom:"Louis FRIGAUD",
grade:"Gardien",
type:"policier"
},

"POL-005":{
nom:"Émilie LAMBERT",
grade:"Lieutenante",
type:"policier"
},

"POL-006":{
nom:"Maxime ROUX",
grade:"Brigadier-chef",
type:"policier"
},

"POL-007":{
nom:"Laura MOREAU",
grade:"Gardienne de la paix",
type:"policier"
},

"POL-008":{
nom:"Julien GARNIER",
grade:"Major",
type:"policier"
},

"POL-009":{
nom:"Sarah DUBOIS",
grade:"Capitaine",
type:"policier"
},

"POL-010":{
nom:"Alexandre MERCIER",
grade:"Commandant",
type:"policier"
},

"PER-001":{
nom:"Marie TUTTARD",
grade:"Agent d'entretien",
type:"personnel"
},

"PER-002":{
nom:"Sophie MARTIN",
grade:"Secrétaire",
type:"personnel"
},

"PER-003":{
nom:"Thomas DURAND",
grade:"Technicien informatique",
type:"personnel"
},

"PER-004":{
nom:"Julie BERNARD",
grade:"Agent d'accueil",
type:"personnel"
},

"PER-005":{
nom:"Claire ROBERT",
grade:"Psychologue",
type:"personnel"
},

"PER-006":{
nom:"Antoine GIRAUD",
grade:"Médecin",
type:"personnel"
},

"INV-001":{
nom:"Invité",
grade:"Visiteur",
type:"invite"
},

"DET-001":{
nom:"Martin Dupont",
type:"détenu"
},

"DET-002":{
nom:"Lucas Dumart",
type:"détenu"
},

"DET-003":{
nom:"Chloé Vignalant",
type:"détenu"
},

"DET-004":{
nom:"Kévin MOREL",
type:"détenu"
},

"DET-005":{
nom:"Nicolas GARCIA",
type:"détenu"
},

"DET-006":{
nom:"Anthony RENAUD",
type:"détenu"
},

"DET-007":{
nom:"Jordan PETIT",
type:"détenu"
},

"DET-008":{
nom:"Lucas RICHARD",
type:"détenu"
},

"DET-009":{
nom:"Mathis CHEVALIER",
type:"détenu"
},

"DET-010":{
nom:"Nathan BLANC",
type:"détenu"
}

};

function onScanSuccess(code){lieu = document.getElementById("lieu").value;

document.getElementById("bip").play();

let r=document.getElementById("resultat");

let maintenant=new Date();

let date=maintenant.toLocaleDateString("fr-FR");

let heure=maintenant.toLocaleTimeString("fr-FR");

if(cartes[code]){

let c=cartes[code];

if(c.type=="policier"){

r.innerHTML=
"🔵<br><br>"+
action.toUpperCase()+
"<br><br>"+
(action=="Entrée" ? "ACCÈS AUTORISÉ" : "SORTIE ENREGISTRÉE")+
"<br><br>"+
c.nom+
"<br>"+
c.grade+
"<br><br>📍 "+lieu;

r.className="valide";

ajouterHistorique(
date+" - "+heure+
"<br>"+
action+
" | "+
c.nom+
"<br>📍 "+lieu
);
  
}else if(c.type=="personnel"){

r.innerHTML=
"🟣<br><br>"+
action.toUpperCase()+
"<br><br>"+
"PERSONNEL AUTORISÉ"+
"<br><br>"+
c.nom+
"<br>"+
c.grade+
"<br><br>📍 "+lieu;

r.className="valide";

ajouterHistorique(
date+" - "+heure+
"<br>"+
action+
" | "+
c.nom+
"<br>📍 "+lieu
);

}else if(c.type=="invite"){

r.innerHTML=
"🟡<br><br>"+
action.toUpperCase()+
"<br><br>"+
(action=="Entrée" ? "ACCÈS INVITÉ" : "DÉPART DE L'INVITÉ")+
"<br><br>"+
c.nom+
"<br>"+
c.grade+
"<br><br>📍 "+lieu;

r.className="valide";

ajouterHistorique(
date+" - "+heure+
"<br>"+
action+
" | "+
c.nom+
"<br>📍 "+lieu
);

}else{

r.innerHTML=
"🟠<br><br>"+
action.toUpperCase()+
"<br><br>"+
"DÉTENU IDENTIFIÉ"+
"<br><br>"+
c.nom+
"<br><br>📍 "+lieu;

r.className="valide";

ajouterHistorique(
date+" - "+heure+
"<br>"+
action+
" | "+
c.nom+
"<br>📍 "+lieu
);

}

}else{

r.innerHTML="🔴<br><br>CARTE INCONNUE<br><br>ACCÈS REFUSÉ";
r.className="refus";

}

}

function ajouterHistorique(texte){

let h=document.getElementById("historique");

if(h.innerHTML=="Aucun scan enregistré."){

h.innerHTML="";
}

h.innerHTML=
texte+"<hr>"+h.innerHTML;

}

function viderHistorique(){

document.getElementById("historique").innerHTML =
"Aucun scan enregistré.";

}

new Html5QrcodeScanner(
"reader",
{fps:10, qrbox:250}
).render(onScanSuccess);

</script>

</body>
</html>
